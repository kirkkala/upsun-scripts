name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck and Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh src/upsun-db-dump src/upsun-check-traffic src/upsun-scripts-common.sh

      - name: Bats
        run: bats tests
